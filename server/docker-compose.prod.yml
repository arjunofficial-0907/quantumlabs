services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.prod

    container_name: quantum-backend-prod

    restart: always

    env_file:
      - .env

    depends_on:
      - postgres

    expose:
      - "8000"

  postgres:

    image: postgres:16

    container_name: quantum-postgres-prod

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quantumlabs

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  nginx:

    image: nginx:latest

    container_name: quantum-nginx

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_prod_data: